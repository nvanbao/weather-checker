<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Weather Checker</h1>
    <div class="search">
      <input id="city-input" type="text" placeholder="Nhập tên thành phố, ví dụ: Da Nang">
      <button id="search-btn">Tìm</button>
    </div>
    <p id="status"></p>
    <section id="result" hidden>
      <h2 id="place"></h2>
      <p id="temp"></p>
      <p id="desc"></p>
      <p id="details"></p>
      <ul id="forecast"></ul>
    </section>
  </main>
</body>
</html>
